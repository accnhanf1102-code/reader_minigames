name: Publish Protelysion
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: protelysion-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify localization and host compatibility
        run: |
          node --check site/distribution.js
          node tools/test_skill_display_vi.mjs
          node tools/test_runtime_localization.mjs
          node tools/test_item_metadata_vi.mjs
          node tools/test_godot_labels.mjs
          node tools/test_async_host.mjs
          node tools/test_reader_loader.mjs
      - name: Verify every asset and complete Godot package
        run: python tools/materialize.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
