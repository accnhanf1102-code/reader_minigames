   const sourceCache=await caches.open('protelysion-resources-v1'),key='https://protelysion-cache.invalid/sha256/'+info.sha256;let saved=await sourceCache.match(key),bytes=saved?await saved.arrayBuffer():null;
   if(!bytes||bytes.byteLength!==info.bytes||await sha(bytes)!==info.sha256){const r=await fetch(new URL('distribution.js',base),{credentials:'omit',signal:AbortSignal.timeout(60000)});if(!r.ok)throw Error('Tải bộ khởi động thất bại HTTP '+r.status);bytes=await r.arrayBuffer();if(bytes.byteLength!==info.bytes||await sha(bytes)!==info.sha256)throw Error('Xác thực bộ khởi động thất bại, từ chối thực thi');await sourceCache.put(key,new Response(bytes,{headers:{'Content-Type':'application/javascript','Content-Length':String(info.bytes),'X-Protelysion-SHA256':info.sha256}}));}

    const timer=setTimeout(()=>finish(Error('启动器执行超时')),30000);script.onload=()=>finish();script.onerror=()=>finish(Error('启动器执行失败'));document.head.append(script);});
  }

 }catch(e){status.textContent='Trang sách tạm thời chưa thể mở ra, vui lòng thử lại.';retry.hidden=false;}finally{busy=false;}}
